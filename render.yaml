services:
  - type: web
    name: whatsapp-reminder-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEFAULT_TIMEZONE
        value: UTC
      - key: API_SECRET
        sync: false
      - key: MONGO_URI
        sync: false

